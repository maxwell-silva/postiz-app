services:
  postiz:
    image: dark-postiz/app:35a4829-authfix
    restart: unless-stopped
    environment:
      MAIN_URL: http://localhost:4007
      FRONTEND_URL: http://localhost:4007
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4007/api
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      X_API_KEY: ''
      X_API_SECRET: ''
      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''
      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''
      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''
      FACEBOOK_APP_ID: ''
      FACEBOOK_APP_SECRET: ''
      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''
      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''
      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''
      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''
      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''
      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''
      MASTODON_URL: https://mastodon.social
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''
      OPENAI_API_KEY: ''
      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''
      API_LIMIT: 30
      FEE_AMOUNT: 0.05
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''
      NX_ADD_PLUGINS: false
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_GTM_ID: ''
    volumes:
    - postiz-config:/config/
    - postiz-uploads:/uploads/
    networks:
    - postiz-network
    - temporal-network
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - Promise.all([fetch('http://localhost:5000/auth').then(r=>{if(r.status!==200)throw
        Error('frontend')}),fetch('http://localhost:3000/public/v1/is-connected').then(r=>{if(r.status!==401)throw
        Error('backend')})]).then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/dark-channels/Dockerfile
      args:
        NEXT_PUBLIC_VERSION: 35a4829-local
    ports:
    - 127.0.0.1:4007:5000
    env_file:
    - ../../.secrets/postiz.env
  postiz-postgres:
    image: postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
    - postgres-volume:/var/lib/postgresql/data
    networks:
    - postiz-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    platform: linux/amd64
    env_file:
    - ../../.secrets/postgres.env
  postiz-redis:
    image: redis:7.2@sha256:00e75fbf4349fea45c7907353554a340c8606ce9f6372afe26ad1039641237a8
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
    - postiz-redis-data:/data
    networks:
    - postiz-network
    platform: linux/amd64
    command:
    - redis-server
    - --appendonly
    - 'yes'
  temporal-elasticsearch:
    image: elasticsearch:7.17.27@sha256:07e9262b856006959e384de7ca9587bc5c6da024ca7042216a9ea26efe4c69c1
    restart: unless-stopped
    environment:
    - cluster.routing.allocation.disk.threshold_enabled=true
    - cluster.routing.allocation.disk.watermark.low=512mb
    - cluster.routing.allocation.disk.watermark.high=256mb
    - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    - xpack.security.enabled=false
    networks:
    - temporal-network
    expose:
    - 9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
    - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    platform: linux/amd64
  temporal-postgresql:
    image: postgres:16@sha256:b95b87e93ceb7594715d5c71fb6e09f6fc878851ab537735d617325eb9ba8b1b
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
    networks:
    - temporal-network
    expose:
    - 5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U temporal
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
    - temporal-postgres-data:/var/lib/postgresql/data
    platform: linux/amd64
    env_file:
    - ../../.secrets/temporal-db.env
  temporal:
    restart: unless-stopped
    image: temporalio/auto-setup:1.28.1@sha256:e4c296d2b16d7607938e71182b9cc0936c90002ff63d97227f195625cf798ea3
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_USER=temporal
    - POSTGRES_SEEDS=temporal-postgresql
    - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    - ENABLE_ES=true
    - ES_SEEDS=temporal-elasticsearch
    - ES_VERSION=v7
    - TEMPORAL_NAMESPACE=default
    networks:
    - temporal-network
    healthcheck:
      test:
      - CMD
      - temporal
      - operator
      - cluster
      - health
      - --address
      - temporal:7233
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
    - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    labels:
      kompose.volume.type: configMap
    platform: linux/amd64
    env_file:
    - ../../.secrets/temporal.env
  temporal-admin-tools:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1@sha256:00864ac86e79aec0d418582892d3435564c613b68b72fe2e41e9c50176794983
    restart: 'no'
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
    - temporal-network
    stdin_open: true
    depends_on:
      temporal:
        condition: service_healthy
    tty: true
    platform: linux/amd64
    profiles:
    - tools
  temporal-ui:
    image: temporalio/ui:2.34.0@sha256:ad58bbefd5919444041ed90ff0498393ee1d95dd9c3d85eb097080d73f6259c6
    restart: unless-stopped
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CORS_ORIGINS=http://localhost:4007
    networks:
    - temporal-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      temporal:
        condition: service_healthy
    platform: linux/amd64
    profiles:
    - monitoring
    ports:
    - 127.0.0.1:8088:8080
volumes:
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false
  temporal-postgres-data:
    external: false
  temporal-elasticsearch-data:
    external: false
networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
name: dark-postiz
